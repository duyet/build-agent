name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-install:
    name: Verify skill install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shorthand
            args: duyet/build-agent
          - name: url-with-skill-flag
            args: https://github.com/duyet/build-agent --skill build-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the skill via the skills CLI (${{ matrix.name }})
        run: |
          set -o pipefail
          npx -y skills add ${{ matrix.args }} | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::'skills add ${{ matrix.args }}' exited with $status"
            exit "$status"
          fi
          echo "Install command succeeded."

      - name: Verify the installed skill
        run: |
          set -e
          # 1. Locate the SKILL.md that 'skills add' placed — specifically the install
          #    location (.agents/skills/...), NOT the repo's own source tree.
          skillmd=$(find "$HOME" "$PWD" -type f \
                    -path '*/.agents/skills/build-agent/SKILL.md' 2>/dev/null | head -1)
          if [ -z "$skillmd" ]; then
            echo "::error::No installed .agents/skills/build-agent/SKILL.md found — install did not place the skill"
            exit 1
          fi
          root=$(dirname "$skillmd")
          echo "Installed skill root: $root"

          # 2. Frontmatter must declare name + description
          grep -q '^name: build-agent' "$root/SKILL.md" \
            || { echo "::error::frontmatter 'name' missing/incorrect"; exit 1; }
          grep -q '^description:' "$root/SKILL.md" \
            || { echo "::error::frontmatter 'description' missing"; exit 1; }

          # 3. Core companion files must come along with the skill
          for f in \
            workflows/from-scratch.md \
            workflows/from-existing.md \
            references/README.md \
            references/frameworks/langgraph.md \
            references/concepts/ai-gateways.md ; do
            test -f "$root/$f" || { echo "::error::missing $f in installed skill"; exit 1; }
          done

          echo "Installed skill verified: frontmatter + workflows + references present."
          head -n 12 "$root/SKILL.md"

  validate-manifests:
    name: Validate plugin + marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON is parseable + required fields present
        run: |
          set -e
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            echo "Checking $f"
            jq empty "$f"
            jq -e '.name' "$f" >/dev/null
          done
          # Skill frontmatter must declare name + description
          grep -q '^name:' skills/build-agent/SKILL.md
          grep -q '^description:' skills/build-agent/SKILL.md
          echo "All manifests valid."
