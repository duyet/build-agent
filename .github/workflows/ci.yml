name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-install:
    name: Verify skill install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shorthand
            args: duyet/build-agent
          - name: url-with-skill-flag
            args: https://github.com/duyet/build-agent --skill build-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the skill via the skills CLI (${{ matrix.name }})
        run: |
          set -o pipefail
          npx -y skills add ${{ matrix.args }} | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::'skills add ${{ matrix.args }}' exited with $status"
            exit "$status"
          fi
          echo "Install command succeeded."

      - name: Verify the installed skill
        run: |
          set -e
          src="$GITHUB_WORKSPACE/skills/build-agent/SKILL.md"   # repo's own source — exclude it

          echo "All build-agent SKILL.md on the runner:"
          find "$HOME" "$GITHUB_WORKSPACE" /tmp -type f \
               -path '*build-agent/SKILL.md' 2>/dev/null | sed 's/^/  /' || true

          # Pick the SKILL.md the installer placed (anything that isn't the checked-out source)
          skillmd=$(find "$HOME" "$GITHUB_WORKSPACE" /tmp -type f \
                    -path '*build-agent/SKILL.md' 2>/dev/null \
                    | grep -vx "$src" | head -1)
          if [ -z "$skillmd" ]; then
            echo "::error::Install produced no SKILL.md outside the repo source — 'skills add' did not place the skill"
            exit 1
          fi
          root=$(dirname "$skillmd")
          echo "Installed skill root: $root"

          # 2. Frontmatter must declare name + description
          grep -q '^name: build-agent' "$root/SKILL.md" \
            || { echo "::error::frontmatter 'name' missing/incorrect"; exit 1; }
          grep -q '^description:' "$root/SKILL.md" \
            || { echo "::error::frontmatter 'description' missing"; exit 1; }

          # 3. Core companion files must come along with the skill
          for f in \
            workflows/from-scratch.md \
            workflows/from-existing.md \
            references/README.md \
            references/frameworks/langgraph.md \
            references/concepts/ai-gateways.md ; do
            test -f "$root/$f" || { echo "::error::missing $f in installed skill"; exit 1; }
          done

          echo "Installed skill verified: frontmatter + workflows + references present."
          head -n 12 "$root/SKILL.md"

  validate-manifests:
    name: Validate plugin + marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON is parseable + required fields present
        run: |
          set -e
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            echo "Checking $f"
            jq empty "$f"
            jq -e '.name' "$f" >/dev/null
          done
          # Skill frontmatter must declare name + description
          grep -q '^name:' skills/build-agent/SKILL.md
          grep -q '^description:' skills/build-agent/SKILL.md
          echo "All manifests valid."

  verify-with-claude:
    name: Verify skill loads in Claude (headless)
    runs-on: ubuntu-latest
    # The jobs above prove the skill *installs* and the manifests parse. This
    # one proves Claude *discovers* it: preinstall via `skills add`, mirror it
    # into ~/.claude/skills/ (where Claude Code scans), then ask Claude Code
    # (headless) to enumerate its available skills.
    # Public repo: skip on forks (no secret access). The live step also skips
    # gracefully when ANTHROPIC_API_KEY is unset, so CI stays green until the
    # secret is added — add it to enable the live check.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preinstall the skill
        run: |
          set -o pipefail
          npx -y skills add duyet/build-agent | tee install.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || { echo "::error::'skills add duyet/build-agent' exited with $status"; exit "$status"; }

          src="$GITHUB_WORKSPACE/skills/build-agent/SKILL.md"   # repo's own source — exclude it
          root=$(dirname "$(find "$HOME" "$GITHUB_WORKSPACE" /tmp -type f \
                  -path '*build-agent/SKILL.md' 2>/dev/null \
                  | grep -vx "$src" | head -1)")
          [ -n "$root" ] || { echo "::error::skill did not install (no SKILL.md outside repo source)"; exit 1; }
          echo "Installed at: $root"

          # Guarantee Claude Code discovers it regardless of where `skills add`
          # placed it: mirror the installed root into ~/.claude/skills/.
          mkdir -p "$HOME/.claude/skills"
          rm -rf "$HOME/.claude/skills/build-agent"
          cp -r "$root" "$HOME/.claude/skills/build-agent"
          echo "Mirrored to: $HOME/.claude/skills/build-agent"

      - name: Ask Claude to list its skills (headless print mode)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set — skipping live Claude check. Add the repo secret to enable it."
            exit 0
          fi
          set -o pipefail
          # One assistant turn, no tools: we only want the skill list, not invocation.
          npx -y @anthropic-ai/claude-code@latest \
            -p "List every Agent Skill you currently have available. For each, output its name and a one-line description. Then stop." \
            --output-format text \
            --max-turns 1 \
            | tee claude.out
          grep -qi 'build-agent' claude.out \
            || { echo "::error::Claude did not list the build-agent skill"; exit 1; }
          echo "Claude discovered the build-agent skill."
